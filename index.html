<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>Impromptu</title>
    <meta name="description" content="Teleprompter camera: record yourself while your script scrolls right under the lens. Works offline. English & Khmer." />

    <!-- Installable app (PWA) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0E0C0B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Impromptu" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- iPhone launch screens (portrait) -->

    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash/splash-1170x2532.png" />

    <link rel="preload" href="fonts/playfair-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app" aria-live="polite">
      <div class="boot"><span class="boot-logo"></span></div>
    </div>
